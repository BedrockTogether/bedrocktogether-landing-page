#page title
page_title                                : BedrockTogether                           # Automatically populates with app name if not set and if iOS app ID is set. Otherwise enter manually.

# ---------------------------------------------------------------------------
# SEO settings (consumed by jekyll-seo-tag). GitHub Pages does not run the
# App Store auto-populate plugin, so these are set manually.
# ---------------------------------------------------------------------------
title                                     : BedrockTogether
tagline                                   : "Servers on Xbox, PlayStation & Switch"
url                                       : "https://bedrocktogether.net"
description                               : "BedrockTogether makes any Minecraft Bedrock Edition server appear as a LAN game on Xbox, PlayStation & Nintendo Switch. Join your favourite server in seconds — no PC required."
author                                    : BedrockTogether Team
logo                                      : /assets/appicon.png
image                                     : /assets/headerimage.png
twitter:
  card                                    : summary_large_image
social:
  name                                    : BedrockTogether
  links:
    - https://play.google.com/store/apps/details?id=pl.extollite.bedrocktogetherapp
    - https://apps.apple.com/app/id1534593376
    - https://discord.gg/PDEfcUaKFj
    - https://facebook.com/bedrocktogether
    - https://instagram.com/bedrocktogether

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# App Info
ios_app_id                                : 1534593376                                # Required. Enter iOS app ID to automatically populate name, price and icons (e.g. 718043190).
ios_app_country                           : us                                        # Required outside USA. Enter 2 letter country code as in https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2

appstore_link                             : https://apps.apple.com/app/bedrocktogether/id1534593376   # Automatically populates if not set and if iOS app ID is set. Otherwise enter manually.
playstore_link                            : https://play.google.com/store/apps/details?id=pl.extollite.bedrocktogetherapp&hl=en&gl=US                                          # Enter Google Play Store URL.
presskit_download_link                    :                                           # Enter a link to downloadable file or (e.g. public Dropbox link to a .zip file).
                                                                                      # Or upload your press kit file to assets and set path accordingly (e.g. "assets/your_press_kit.zip").
discord_link                              : https://discord.gg/PDEfcUaKFj

app_icon                                  : /assets/appicon.png                        # Automatically populates if not set and if iOS app ID is set.  Otherwise enter path to icon file manually.
app_name                                  : BedrockTogether                            # Automatically populates if not set and if iOS app ID is set.  Otherwise enter manually.
app_price                                 : Free                                       # Automatically populates if not set and if iOS app ID is set.  Otherwise enter manually.
app_description                           : BedrockTogether lets you join any Bedrock Edition server from Minecraft on Xbox, PlayStation and Nintendo Switch — no PC and no DNS changes required.

enable_smart_app_banner                   : true                                      # Set to true to show a smart app banner at top of page on mobile devices.



