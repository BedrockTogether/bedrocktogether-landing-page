<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<base target="_blank">

	<!-- Title, meta description, canonical, Open Graph & Twitter cards are
	     generated by jekyll-seo-tag from _config.yml (title/tagline/description/
	     url/image/twitter/social) and per-page front matter. -->
	{% seo %}

	<link rel="icon" href="{{ site.app_icon | relative_url }}">
	<link rel="shortcut icon" href="{{ site.app_icon | relative_url }}">
	<link rel="apple-touch-icon" href="{{ site.app_icon | relative_url }}">

	<!-- Smart App Banner -->
	{% if site.enable_smart_app_banner %}
		<meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">
	{% endif %}

	<!-- Rich result: app rating stars in search. Ratings are also shown on the
	     page (Features section), per Google's structured-data policy. -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "MobileApplication",
		"name": "BedrockTogether",
		"operatingSystem": "iOS, Android",
		"applicationCategory": "GameApplication",
		"url": "https://bedrocktogether.net",
		"description": {{ site.description | jsonify }},
		"image": "https://bedrocktogether.net{{ '/assets/headerimage.png' }}",
		"offers": {
			"@type": "Offer",
			"price": "0",
			"priceCurrency": "USD"
		},
		"aggregateRating": {
			"@type": "AggregateRating",
			"ratingValue": "4.5",
			"ratingCount": "128000"
		},
		"downloadUrl": [
			"https://apps.apple.com/app/id1534593376",
			"https://play.google.com/store/apps/details?id=pl.extollite.bedrocktogetherapp"
		]
	}
	</script>

	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
	<link rel="stylesheet" href="{{ '/main.css' | relative_url }}">
</head>
