<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- Title, meta description, canonical, Open Graph & Twitter cards are
	     generated by jekyll-seo-tag from _config.yml (title/tagline/description/
	     url/image/twitter/social) and per-page front matter. -->
	{% seo %}

	<!-- Favicon. Deliberately NOT the App Store icon: its pale sky and fine pixel
	     detail turn to mush at 16px and disappear against a white search result.
	     This is a simplified, high-contrast version of the same mark. -->
	<link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
	<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
	<link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/favicon-96.png' | relative_url }}">
	<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/favicon-192.png' | relative_url }}">
	<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
	<meta name="theme-color" content="#2E7CD6">

	<!-- Smart App Banner -->
	{% if site.enable_smart_app_banner %}
		<meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">
	{% endif %}

	<!-- Rich result: app rating stars in search. Homepage only — the guide pages
	     are articles, not the app itself. Ratings are also shown on the page
	     (Features section), per Google's structured-data policy. -->
	{% if page.url == '/' %}
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "MobileApplication",
		"name": "BedrockTogether",
		"operatingSystem": "iOS, Android",
		"applicationCategory": "UtilitiesApplication",
		"url": "https://bedrocktogether.net",
		"description": {{ site.description | jsonify }},
		"image": "https://bedrocktogether.net{{ '/assets/appicon.png' }}",
		"offers": {
			"@type": "Offer",
			"price": "0",
			"priceCurrency": "USD"
		},
		"aggregateRating": {
			"@type": "AggregateRating",
			"ratingValue": "4.5",
			"ratingCount": "122209"
		},
		"downloadUrl": [
			"https://apps.apple.com/app/id1534593376",
			"https://play.google.com/store/apps/details?id=pl.extollite.bedrocktogetherapp"
		]
	}
	</script>
	{% endif %}

	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
	<link rel="stylesheet" href="{{ '/main.css' | relative_url }}">
</head>
